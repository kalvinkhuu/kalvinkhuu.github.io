# Website-only prose. Each list item is a paragraph.
about:
  - >-
    I am a **PhD student in Software Engineering** at McMaster University,
    supervised by [Dr. Sébastien Mosser](https://mosser.github.io/agenda/) under
    the **FATES-MLOps** project. My research sits at the intersection of AI
    safety, assurance case methodology, and MLOps — developing lightweight,
    verifiable approaches to validate and certify the requirements of AI and
    machine learning systems.
  - >-
    I have published at venues including **ICSE-NIER**, **ECMFA** and **MoDRE**,
    with work spanning model card evaluation, safety modelling for ML pipelines,
    and fairness justification diagrams. I also hold a Bachelor of Engineering in
    Software Engineering from **McGill University**.

