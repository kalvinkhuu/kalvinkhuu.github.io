publications:
  - venue: MoDRE
    kind: Workshop Paper
    title: Safety First! Modelling Requirements from GPT-5 System Card using
      Lightweight Safety Models
    url: https://www.modre2026.ece.mcgill.ca/proceedings/MoDRE2026_7.pdf
    date: Aug 2026
    highlights:
      - Lead-authored a paper where we performed an in-depth manual analysis of
        the 60-page GPT-5 system card, eliciting 74 claims and 22 implicit safety
        requirements, classified against the MIT AI Risk Repository taxonomy.
      - Analysis reveals uneven, tightly coupled, and under-specified requirement
        coverage across privacy, safety, and misinformation domains.
      - Applied justification diagrams to formally model requirement compliance
        (e.g., chemical/biological capability thresholds), surfacing OpenAI's
        heavy reliance on safeguarding, benchmarks, and external red-teaming as
        evidence.

  - venue: RE
    kind: Tutorial
    title: Validating Requirements of Machine Learning Pipelines with
      Justification Models
    url: https://conf.researchr.org/home/RE-2026
    date: Aug 2026
    highlights:
      - Co-authored a tutorial where we modelled and validated ML pipeline design
        rationale using jPipe to combat "decision drift", integrating automated
        conformance checks into CI/CD for reproducible, requirement-traceable
        pipelines.

  - venue: ECMFA
    kind: Journal Paper
    title: Capturing and Organizing Reusable Interaction Practices Using
      Justification and Feature Models
    url: https://www.jot.fm/issues/issue_2026_03/a14.pdf
    date: Jun 2026
    highlights:
      - Developed a novel framework combining safety-inspired justification
        diagrams with feature-model variability management to make tacit
        best-practice knowledge explicit, composable, and reusable.
      - Demonstrated automated composition (assembly and refinement operators) of
        individual practices into coherent, auditable argumentation structures
        using the JPIPE and UVL/FLAMAPY toolchains.

  - venue: SCC-BOOK'26
    kind: Book Chapter
    title: Role of MLOps to validate the Requirements of AI Models using
      Lightweight Assurance Cases
    url: https://sos-vo.org/group/scc
    date: May 2026
    highlights:
      - Proposed a lightweight assurance-case approach integrating MLOps
        practices to support requirements validation and certification of AI
        systems within a book chapter.

  - venue: ICSE-NIER
    kind: Conference Paper
    title: "Model Cards for Responsible AI: Stop Carding, Start Modelling"
    url: https://dl.acm.org/doi/10.1145/3786582.3786804
    date: Apr 2026
    highlights:
      - Lead-authored a paper that evaluates current AI/ML documentation
        practices and introduces an actionable, verifiable alternative to
        narrative model cards.
      - Extracted and categorized **32 recurring safety patterns** from provider
        model cards; quantified **inter-provider inconsistency** (only ~22%
        shared coverage across patterns).
      - Operationalized model-card content into structured assurance cases for
        **CBRN** and **cybersecurity** risks using evidence from **GPT-OSS**,
        **Claude 3**, and **Gemma 3n**.

